# The app's contract with Pippa. Pippa builds everything it shows about the
# app from this file, and refuses any output not declared here.

manifest_version: 1

# Every hackathon app keeps nothing between calls. Do not change this.
persistence: none

# The public author name, shown as "by <name>". A pseudonym.
app_author_name: "mickeyyy"

app:
  # Fixed by the repository name (Pippa-Labs/pippa-hack-app-07d1).
  id: hack.app_07d1
  name: Cycle Hire Dock Recommendation
  # Bump this before pushing again once a version is submitted for review.
  version: 0.2.0
  # Never use the word "by" here: the badge is parsed on it.
  summary: >-
    Recommends the best Santander Cycles dock to end your ride in London,
    using live free spaces, ride time and walking time. It looks up places
    with postcodes.io and OpenStreetMap, and docks with TfL.

agent_types:
  - personal

outcomes:
  - id: dock.recommend
    summary: >-
      Pick the best Santander Cycles docking station to return a bike near a
      London destination, from live free spaces, ride and walking time
    # Only the first four reach Pippa's first decision, so the clearest come first.
    example_phrases:
      - where should i dock my bike near south kensington
      - santander bike space near kings cross
      - where can i return a boris bike near waterloo
      - cycling from imperial to oxford circus where to dock
      - free cycle hire docks near sw7 2az
      - where to leave my santander bike near liverpool street
      - docking station with free spaces near
      - best place to drop off a santander cycle
    inputs:
      # Optional on purpose: a missing required input is refused before the
      # app runs, with a message blaming the app. The app says what to type.
      - name: destination
        type: string
        required: false
        description: >-
          Where the person wants to end up after docking the bike: a London
          place name, landmark, street, station or postcode, exactly as they
          wrote it (for example "Oxford Circus" or "SW7 2AZ"). This is where
          they are going, not where they are starting. If the message does
          not name a destination, return an empty string rather than guessing.
      - name: origin
        type: string
        required: false
        description: >-
          Where the person is cycling FROM, only if the message says so (for
          example "from Imperial" or "starting at Waterloo"). A place name,
          landmark or postcode, as written. If they did not say where they
          are starting from, return an empty string rather than guessing.
    output:
      - name: recommended_name
        type: string
        description: Recommended dock's name, as TfL writes it.
      - name: recommended_empty_docks
        type: integer
        description: Free spaces at the recommended dock right now (TfL NbEmptyDocks).
      - name: recommended_total_docks
        type: integer
        description: Total docking points at the recommended dock (TfL NbDocks).
      - name: recommended_risk
        type: string
        description: Risk of finding it full on arrival - low, medium or high.
      - name: recommended_ride_min
        type: integer
        required: false
        description: Estimated minutes cycling from the start to this dock. Missing when no starting point was given.
      - name: recommended_walk_min
        type: integer
        description: Estimated minutes walking from this dock to the destination.
      - name: recommended_total_min
        type: integer
        description: Ride plus walk plus a risk allowance (low 0, medium 3, high 8 minutes); lowest wins.
      - name: backup1_name
        type: string
        required: false
        description: Backup 1 dock's name, as TfL writes it.
      - name: backup1_empty_docks
        type: integer
        required: false
        description: Free spaces at the backup 1 dock right now (TfL NbEmptyDocks).
      - name: backup1_total_docks
        type: integer
        required: false
        description: Total docking points at the backup 1 dock (TfL NbDocks).
      - name: backup1_risk
        type: string
        required: false
        description: Risk of finding it full on arrival - low, medium or high.
      - name: backup1_ride_min
        type: integer
        required: false
        description: Estimated minutes cycling from the start to this dock. Missing when no starting point was given.
      - name: backup1_walk_min
        type: integer
        required: false
        description: Estimated minutes walking from this dock to the destination.
      - name: backup1_total_min
        type: integer
        required: false
        description: Ride plus walk plus a risk allowance (low 0, medium 3, high 8 minutes); lowest wins.
      - name: backup2_name
        type: string
        required: false
        description: Backup 2 dock's name, as TfL writes it.
      - name: backup2_empty_docks
        type: integer
        required: false
        description: Free spaces at the backup 2 dock right now (TfL NbEmptyDocks).
      - name: backup2_total_docks
        type: integer
        required: false
        description: Total docking points at the backup 2 dock (TfL NbDocks).
      - name: backup2_risk
        type: string
        required: false
        description: Risk of finding it full on arrival - low, medium or high.
      - name: backup2_ride_min
        type: integer
        required: false
        description: Estimated minutes cycling from the start to this dock. Missing when no starting point was given.
      - name: backup2_walk_min
        type: integer
        required: false
        description: Estimated minutes walking from this dock to the destination.
      - name: backup2_total_min
        type: integer
        required: false
        description: Ride plus walk plus a risk allowance (low 0, medium 3, high 8 minutes); lowest wins.
      - name: nearest_is_recommended
        type: boolean
        description: True when the dock closest to the destination is also the recommended one.
      - name: nearest_name
        type: string
        required: false
        description: The dock closest to the destination, when it is not the recommended one (even if full).
      - name: nearest_empty_docks
        type: integer
        required: false
        description: Free spaces at that nearest dock.
      - name: nearest_total_docks
        type: integer
        required: false
        description: Total docking points at that nearest dock.
      - name: nearest_risk
        type: string
        required: false
        description: Risk at that nearest dock - low, medium, high, or full when it has no free spaces.
      - name: nearest_metres_closer
        type: integer
        required: false
        description: Roughly how many metres less walking the nearest dock would be than the recommended one.
      - name: nearest_walk_min_closer
        type: integer
        required: false
        description: How many minutes less walking the nearest dock would be than the recommended one.
      - name: nearest_why_not
        type: string
        required: false
        description: Why the nearest dock was not recommended, for example "only 1 free space, high risk".
      - name: data_updated
        type: datetime
        description: When TfL last updated the oldest dock figure shown here (UTC).
      - name: data_possibly_stale
        type: boolean
        description: True when any dock figure shown is more than 15 minutes old.
      - name: note
        type: string
        description: >-
          When the live data is from, that spaces can change before arrival,
          and any other caveat (no starting point given, stale data).
